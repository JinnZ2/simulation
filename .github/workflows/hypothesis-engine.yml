name: hypothesis-engine

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mon/Thu 06:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic name override (optional; runs only this topic)"
        required: false
        type: string
      max_per_topic:
        description: "Max results per query"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Skip network, use bundled sample findings"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: hypothesis-engine
  cancel-in-progress: false

defaults:
  run:
    working-directory: hypothesis-engine

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Offline smoke run
        run: |
          python scripts/hypothesis_engine.py --dry-run \
            --data-dir "$RUNNER_TEMP/data" \
            --hypotheses-dir "$RUNNER_TEMP/hypotheses"

  run-engine:
    needs: test
    runs-on: ubuntu-latest
    # 23 queries x up to 3 sources = 55 calls; each _fetch() has a 20s timeout,
    # so a pathological all-timeout run needs ~18 min. 15 was too tight.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve config (topic override)
        env:
          TOPIC_OVERRIDE: ${{ inputs.topic }}
        run: |
          python - <<'EOF'
          import json, os, shutil
          override = os.environ.get("TOPIC_OVERRIDE", "").strip()
          src, dst = "config/topics.json", "config/topics.effective.json"
          if override:
              cfg = json.load(open(src))
              match = [t for t in cfg["topics"] if t["name"] == override]
              if match:
                  json.dump({"topics": match}, open(dst, "w"), indent=2)
                  print("Using topic override:", override)
                  raise SystemExit(0)
              print("Override topic not found; running full config")
          shutil.copy(src, dst)
          EOF

      - name: Run hypothesis engine
        env:
          # Optional. Semantic Scholar rate-limits anonymous traffic hard; a
          # key (free, https://www.semanticscholar.org/product/api) gives the
          # engine its own quota. Absent, the source degrades to best-effort.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          python scripts/hypothesis_engine.py \
            --config config/topics.effective.json \
            --max-per-topic "${{ inputs.max_per_topic || '5' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hypothesis-engine-output
          path: |
            hypothesis-engine/data/
            hypothesis-engine/hypotheses/
          if-no-files-found: ignore
          retention-days: 30

      # A dry run reads the bundled sample corpus, so its output must never
      # reach the repo or an issue: committing it would overwrite the real
      # digest with fixture data, and that is the one path meant to be safe
      # to test with.
      - name: Commit results
        if: ${{ !inputs.dry_run }}
        run: |
          rm -f config/topics.effective.json
          git config user.name "hypothesis-engine[bot]"
          git config user.email "hypothesis-engine[bot]@users.noreply.github.com"
          git add data/ hypotheses/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(engine): research digest $(date -u +%Y-%m-%d)"
            # Anything landing on the branch between checkout and here would
            # otherwise reject the push and lose the run's digest entirely.
            # Replaying on top is the right resolution: the digest only ever
            # appends generated files. A genuine conflict fails the step
            # loudly rather than resolving itself -- this must never clobber
            # someone else's commit.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Open issue on new hypotheses
        if: ${{ success() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/engine_report.md ] && grep -q "NEW HYPOTHESIS" data/engine_report.md; then
            # Idempotent: creates the label the first time, no-op after.
            gh label create hypothesis-engine --color 0e8a16 \
              --description "Autonomous research digest" --force
            gh issue create \
              --title "Hypothesis engine: new hypotheses $(date -u +%Y-%m-%d)" \
              --body-file data/engine_report.md \
              --label "hypothesis-engine"
          else
            echo "No NEW HYPOTHESIS marker; skipping issue"
          fi
