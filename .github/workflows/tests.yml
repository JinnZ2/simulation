name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        piece: [simulation, hypothesis-engine, sims]
    defaults:
      run:
        working-directory: ${{ matrix.piece }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Install numpy (sims only)
        if: matrix.piece == 'sims'
        run: pip install numpy
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Ledger integrity
        if: matrix.piece == 'sims'
        run: python3 ledger_hook.py --check

  # frame-instruments holds more than one independent build of one work order,
  # so it has no single tests/ directory and no single test count. Each arm is
  # run on its own, and the arms are checked against the work order and against
  # the commits they came from. See frame-instruments/ARMS.md.
  frame-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frame-instruments
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # --provenance compares against merge parents
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every arm's suites
        run: python3 run_arms.py
      - name: Arms are their parents verbatim plus the declared edits
        run: python3 coverage.py --provenance
      - name: Checks on the arm machinery
        run: python3 test_coverage.py
      - name: Requirement coverage and the discriminator queue
        run: |
          python3 coverage.py
          python3 coverage.py --queue

  # STATUS.md is the first thing anyone reads; a stale one is worse than none.
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: STATUS.md is current
        run: python3 status.py --check

  # The simulation must also run with no third-party packages at all — the
  # config loader's YAML fallback exists for exactly this case.
  stdlib-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Confirm PyYAML is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('yaml') is not None)"
      - name: Run without PyYAML
        run: python run.py --cycles 200 --log-level cycle --output -
